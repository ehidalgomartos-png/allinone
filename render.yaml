services:
  - type: web
    name: omnisocial
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: omnisocial-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: omnisocial-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "18"
    databaseName: omnisocial
    user: omnisocial
