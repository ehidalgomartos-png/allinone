services:
  - type: web
    name: omnisocial
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: omnisocial-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_LOGIN_CONFIG_ID
        sync: false
      - key: META_GRAPH_VERSION
        value: v26.0
      - key: PUBLIC_BASE_URL
        fromService:
          type: web
          name: omnisocial
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: omnisocial-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "18"
    databaseName: omnisocial
    user: omnisocial
