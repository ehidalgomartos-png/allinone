services:
  - type: web
    name: omnisocial
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: omnisocial-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: APP_URL
        value: https://instantadmirers.com
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "true"
      - key: CLOUDINARY_URL
        sync: false

databases:
  - name: omnisocial-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "18"
    databaseName: omnisocial
    user: omnisocial
